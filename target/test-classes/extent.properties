extent.reporter.spark.start=true
extent.reporter.spark.out=reports/EcommerceMobileAutomationReport.html
extent.reporter.spark.config=src/test/resources/extent-config.xml

# Failure screenshots are also embedded straight into the HTML report.
screenshot.dir=screenshots/
screenshot.rel.path=../screenshots/

basefolder.name=test-output/ExtentReport
basefolder.datetimepattern=dd-MMM-yyyy_HH-mm-ss
