extent.reporter.spark.start=true
# Platform-neutral filename and title, deliberately - this whole file
# (extent.properties) is one single classpath resource shared by BOTH
# mobile and web (there's no way to load a second, platform-specific
# copy), and the extentreports-cucumber7-adapter resolves these two
# specific keys straight from the loaded properties file, ignoring any
# JVM system property override WebTestRunner might set for them (only
# basefolder.name below actually honors a runtime override - see
# WebTestRunner's static block). So the filename/title here are used
# as-is for BOTH platforms; basefolder.name is what actually tells
# their reports apart, in the archive folder name.
extent.reporter.spark.out=reports/GajabAutomationReport.html
extent.reporter.spark.config=src/test/resources/extent-config.xml

# Failure screenshots are also embedded straight into the HTML report.
screenshot.dir=screenshots/
screenshot.rel.path=../screenshots/

# Mobile's own archive folder prefix - web overrides this (the one key
# that genuinely respects a runtime override) to "WebExtentReport" in
# WebTestRunner's static block, so mobile and web runs land in
# distinctly-named test-output/ folders despite writing the
# identically-named report file above.
basefolder.name=test-output/MobileExtentReport
basefolder.datetimepattern=dd-MMM-yyyy_HH-mm-ss
