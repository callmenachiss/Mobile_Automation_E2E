# =========================================================================
# ECOMMERCE MOBILE AUTOMATION - CONFIGURATION
# Every value below can be changed WITHOUT touching a single line of Java.
# See README.md -> "Configuration" section for a full explanation.
# =========================================================================

# ---------- Appium Server ----------
# If autostart=true, the framework starts/stops the Appium server for you.
# Set it to false if you prefer to start "appium" yourself in a terminal.
appium.server.autostart=true
appium.server.ip=127.0.0.1
appium.server.port=4723

# ---------- Device / Capability Settings ----------
# >>> TO BE FILLED IN <<< real device details go here (deviceName, udid, platformVersion).
platformName=Android
automationName=UiAutomator2

# A friendly/model name for the device, e.g. "Pixel 7" or "Android Emulator".
# Run `adb devices -l` to see connected devices and their model names.
deviceName=GalaxyM30

# The device's unique id from `adb devices` (first column). Strongly
# recommended for a REAL device, and required if more than one
# device/emulator is connected at the same time. Leave blank for a single
# emulator - Appium will pick the only one available.
udid=RZ8N506BJDE

# Leave blank to let Appium auto-detect the connected device's Android version,
# or set it explicitly (e.g. 14) if you want to be strict about it.
platformVersion=

