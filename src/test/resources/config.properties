# ---------- Application Under Test ----------
# >>> TO BE FILLED IN <<< once the real APK is available.
# STEP 1: Copy your .apk file into the /apps folder.
# STEP 2: Put its file name here (path is relative to the project root).
app.path=

# STEP 3: Update these two values for YOUR app.
# See README.md -> "Finding appPackage and appActivity" for how to get them.
appPackage=com.gajab.buyerstore
appActivity=com.gajab.buyerstore.MainActivity

# noReset=true keeps the app's data (e.g. login session) between test runs.
app.noReset=true
# Automatically grants runtime permissions (camera, storage, etc.) on install.
app.autoGrantPermissions=true
# How long Appium waits (seconds) before assuming the app/session is unresponsive.
app.newCommandTimeout=120

# ---------- Session startup speed ----------
# The driver session is created ONCE for the whole suite (see Hooks), so
# these only affect the one-time "installing/starting UiAutomator2 on the
# device" delay before the first scenario - not per-scenario time.

# Skips some one-time device checks (locale, unlock state, etc). Safe to
# leave true for a device you already use regularly for these tests.
appium.skipDeviceInitialization=true

# Speeds up UI transitions during the whole run (not just startup). Safe default.
appium.disableWindowAnimation=true

# Skips reinstalling the io.appium.uiautomator2.server/.test helper APKs on
# the device - this install is usually the single biggest chunk of the
# "long time to start automation" delay on a real device (can be 30-90s+).
# UNSAFE until those APKs are already installed and match this project's
# Appium java-client version: run once with this set to false, confirm the
# suite still passes, THEN flip to true. If you later bump appium.version
# in pom.xml, set this back to false for one run so the matching server gets
# reinstalled, then flip it back to true.
appium.skipServerInstallation=false

# ---------- Waits ----------
# Maximum seconds the framework waits for an element to appear before failing.
# Shared by both mobile (BasePage) and web (BaseWebPage).
explicit.wait.seconds=20

# ---------- Web Automation ----------
# chrome, firefox or edge. For LOCAL runs (web.remote.enabled=false), no
# driver download/setup needed - Selenium Manager (bundled with Selenium
# 4.6+) fetches the matching chromedriver/geckodriver/msedgedriver
# automatically.
web.browser=chrome

# Run the browser without a visible window (useful in CI). Ignored for
# remote runs - headless is controlled by the grid/provider instead.
web.headless=false

# Maximize the browser window on launch.
web.window.maximize=true

# >>> TO BE FILLED IN <<< the site's URL. WebDriverManager navigates here
# at the start of every scenario (see WebHooks/WebDriverManager.resetState()).
web.baseUrl=https://stg.gajab.com/

# Run against a remote Selenium server (a Selenium Grid hub/node, or a
# cloud provider like BrowserStack/Sauce Labs/LambdaTest) instead of a
# browser on this machine. web.browser above still picks which browser to
# request from that remote server.
web.remote.enabled=false

# >>> TO BE FILLED IN <<< only needed when web.remote.enabled=true.
# A local Selenium Grid hub is typically http://localhost:4444/wd/hub -
# see https://www.selenium.dev/documentation/grid/getting_started/.
# A cloud provider gives you a URL with embedded credentials, e.g.
# https://<user>:<key>@hub.browserstack.com/wd/hub - keep any credentials
# out of source control; set this via an environment-specific override
# instead of committing a real key here.
web.remote.url=

# ---------- Email notification (sent once, after the whole run finishes) ----------
mail.enabled=true
# Who receives the pass/fail summary email.
mail.to=nachiyappanworks@gmail.com

# >>> TO BE FILLED IN <<< the mailbox that SENDS the email (e.g. a Gmail account).
# For Gmail: enable 2FA and create an "App Password" - do NOT use your normal password.
mail.from=
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.starttls=true

# SECURITY: the sending mailbox's password/app-password is deliberately NOT stored
# here. Set it as the MAIL_FROM_PASSWORD environment variable instead (locally,
# in your IntelliJ run configuration, or as a CI secret) - see README.md ->
# "Email notifications" for how. If it's not set, the email is skipped (logged,
# does not fail the build).

# Optional: prefix used in the email subject line.
mail.subject.prefix=Gajab Mobile Automation
# Optional: a publicly reachable URL to the HTML report (e.g. a CI artifact link).
# Leave blank locally - the email will link to the local report file instead.
mail.report.link=
