# ---------- Application Under Test ----------
# >>> TO BE FILLED IN <<< once the real APK is available.
# STEP 1: Copy your .apk file into the /apps folder.
# STEP 2: Put its file name here (path is relative to the project root).
app.path=

# STEP 3: Update these two values for YOUR app.
# See README.md -> "Finding appPackage and appActivity" for how to get them.
appPackage=com.gajab.buyerstore
appActivity=com.gajab.buyerstore.MainActivity

# noReset=true keeps the app's data (e.g. login session) between test runs.
app.noReset=true
# Automatically grants runtime permissions (camera, storage, etc.) on install.
app.autoGrantPermissions=true
# How long Appium waits (seconds) before assuming the app/session is unresponsive.
app.newCommandTimeout=120

# ---------- Waits ----------
# Maximum seconds the framework waits for an element to appear before failing.
# Shared by both mobile (BasePage) and web (BaseWebPage).
explicit.wait.seconds=20

# ---------- Web Automation ----------
# chrome or firefox. No driver download/setup needed - Selenium Manager
# (bundled with Selenium 4.6+) fetches the matching driver automatically.
web.browser=chrome

# Run the browser without a visible window (useful in CI).
web.headless=false

# Maximize the browser window on launch.
web.window.maximize=true

# >>> TO BE FILLED IN <<< the site's URL. WebDriverManager navigates here
# at the start of every scenario (see WebHooks/WebDriverManager.resetState()).
web.baseUrl=

# ---------- Email notification (sent once, after the whole run finishes) ----------
mail.enabled=true
# Who receives the pass/fail summary email.
mail.to=nachiyappanworks@gmail.com

# >>> TO BE FILLED IN <<< the mailbox that SENDS the email (e.g. a Gmail account).
# For Gmail: enable 2FA and create an "App Password" - do NOT use your normal password.
mail.from=
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.starttls=true

# SECURITY: the sending mailbox's password/app-password is deliberately NOT stored
# here. Set it as the MAIL_FROM_PASSWORD environment variable instead (locally,
# in your IntelliJ run configuration, or as a CI secret) - see README.md ->
# "Email notifications" for how. If it's not set, the email is skipped (logged,
# does not fail the build).

# Optional: prefix used in the email subject line.
mail.subject.prefix=Ecommerce Mobile Automation
# Optional: a publicly reachable URL to the HTML report (e.g. a CI artifact link).
# Leave blank locally - the email will link to the local report file instead.
mail.report.link=
