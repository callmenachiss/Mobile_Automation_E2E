# =========================================================================
# ECOMMERCE MOBILE AUTOMATION - CONFIGURATION
# =========================================================================

# ---------- Appium Server ----------
# If autostart=true, the framework starts/stops the Appium server for you.
# Set false if you prefer to start Appium manually.

appium.server.autostart=true
appium.server.ip=127.0.0.1
appium.server.port=4723


# ---------- Device / Capability Settings ----------
platformName=Android
automationName=UiAutomator2

# ---------- Useful Setup Commands ----------

# Start Appium server
# appium --address 127.0.0.1 --port 4723

# Restart ADB
# adb kill-server
# adb start-server

# Check connected devices
# adb devices -l

# Set Android SDK environment variables
# $env:ANDROID_HOME = "C:\Users\venka\AppData\Local\Android\Sdk"
# $env:ANDROID_SDK_ROOT = "C:\Users\venka\AppData\Local\Android\Sdk"

# Add Android platform-tools to PATH
# $env:Path = "C:\Users\venka\AppData\Local\Android\Sdk\platform-tools;$env:Path"

# Verify Android environment variables
# node -e "console.log('HOME=' + process.env.ANDROID_HOME); console.log('ROOT=' + process.env.ANDROID_SDK_ROOT); console.log('PATH=' + process.env.Path)"

# PowerShell environment checks
# echo $env:ANDROID_HOME
# echo $env:ANDROID_SDK_ROOT

# Check ADB version
# adb --version

# Check connected Android devices
# adb devices

# Check currently resumed Android activity
# adb shell dumpsys activity activities | findstr "mResumedActivity"

# Set Maven environment variable
# $env:MAVEN_HOME="C:\apache-maven-3.9.16"

# Add Maven to PATH
# $env:Path="$env:MAVEN_HOME\bin;$env:Path"

# Check Maven version
# & "C:\apache-maven-3.9.16\bin\mvn.cmd" --version

# Start Appium manually
# appium --address 127.0.0.1 --port 4723

# Run mobile Cucumber tests by tag
# mvn clean test -Dtest=TestRunner "-Dcucumber.filter.tags=@gajab"

# Run web TestNG suite
# mvn clean test "-DsuiteXmlFile=testng-web.xml"


# ---------- Application Under Test ----------

app.path=

appPackage=com.gajab.buyerstore
appActivity=com.gajab.buyerstore.MainActivity

deviceName=RedmiA45G
udid=2c4c5f0d
platformVersion=

appium.server.url=http://127.0.0.1:4723
appium.automationName=UiAutomator2
appium.platformName=Android

appium.skipDeviceInitialization=false
appium.skipServerInstallation=false
appium.disableWindowAnimation=false

appium.autoGrantPermissions=true
appium.autoLaunch=true

# Alternative application configuration
# appPackage=com.gajab.buyerstage
# appActivity=com.gajab.buyerstage.MainActivity

app.noReset=true
app.autoGrantPermissions=true
app.newCommandTimeout=120


# ---------- Waits ----------

explicit.wait.seconds=20


# =========================================================================
# Web Automation
# =========================================================================

# Supported browsers:
# chrome
# edge
# firefox

web.browser=chrome

# false = visible browser
# true = headless browser

web.headless=false

# Maximize browser window
web.window.maximize=true

# Application URL
web.baseUrl=https://stg.gajab.com/


# ---------- Remote WebDriver ----------

# true = use RemoteWebDriver
# false = use local browser

web.remote.enabled=true

# Biogonira RemoteWebDriver endpoint
#
# IMPORTANT:
# Replace this with the actual RemoteWebDriver URL provided
# by your Biogonira environment.
#
# Do NOT use:
# http://localhost:4444/wd/hub
#
# Do NOT leave this blank when running the web tests.

web.remote.url=