name: Web Automation - Daily Run

on:
  push:
    branches:
      - main

  schedule:
    # Every day at 10:00 AM IST (04:30 AM UTC)
    - cron: "30 4 * * *"

  workflow_dispatch:

jobs:
  web-tests:
    name: Web Automation Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Verify Chrome
        run: |
          google-chrome --version || true
          chromedriver --version || true

      - name: Run Web Automation Tests
        run: mvn clean test "-DsuiteXmlFile=testng-web.xml"

      - name: Parse TestNG Results Summary
        if: always()
        id: test_summary
        shell: bash
        run: |
          results_file="test-output/testng-results.xml"

          if [ -f "$results_file" ]; then
            passed=$(grep -oP '(?<=passed=")[0-9]+' "$results_file" | head -1 || echo "0")
            failed=$(grep -oP '(?<=failed=")[0-9]+' "$results_file" | head -1 || echo "0")
            skipped=$(grep -oP '(?<=skipped=")[0-9]+' "$results_file" | head -1 || echo "0")

            echo "Passed: $passed"
            echo "Failed: $failed"
            echo "Skipped: $skipped"

            echo "passed=$passed" >> "$GITHUB_OUTPUT"
            echo "failed=$failed" >> "$GITHUB_OUTPUT"
            echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          else
            echo "TestNG results file not found."

            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            echo "skipped=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Web Automation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Web-Automation-Reports-${{ github.run_number }}
          path: |
            test-output/
            target/extent-reports/
            logs/
            screenshots/
            target/surefire-reports/
          if-no-files-found: ignore

      - name: Send Web Automation Report Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: "Web Automation Report - Run #${{ github.run_number }}"

          to: piccosofttest@gmail.com

          from: "Piccosoft QA Automation <${{ secrets.EMAIL_USERNAME }}>"

          body: |
            Hi Team,

            The Web Automation test execution has been completed.

            Repository:
            ${{ github.server_url }}/${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Workflow:
            ${{ github.workflow }}

            Run:
            #${{ github.run_number }}

            Trigger:
            ${{ github.event_name }}

            Status:
            ${{ job.status }}

            Test Summary:

            Passed: ${{ steps.test_summary.outputs.passed }}
            Failed: ${{ steps.test_summary.outputs.failed }}
            Skipped: ${{ steps.test_summary.outputs.skipped }}

            TestNG Suite:
            testng-web.xml

            Cucumber Tag:
            @web

            Runner:
            com.ecommerce.web.runner.WebTestRunner

            GitHub Actions Run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            TestNG and Extent Reports are available in the GitHub Actions artifacts.

            Regards,
            Piccosoft QA Automation

          attachments: |
            test-output/emailable-report.html
            target/extent-reports/index.html