name: Web Regression Suite

# Starter CI pipeline for the Gajab Web Automation Framework - the
# Selenium counterpart of mobile-regression.yml. No Android emulator is
# needed here (that's the mobile-only cost); Chrome ships preinstalled
# on GitHub's ubuntu-latest runners, and Selenium Manager (bundled with
# Selenium 4.6+) downloads a matching chromedriver automatically.
#
# config.properties currently ships with web.headless=false, so this
# runs Chrome under a virtual display (xvfb) rather than requiring a
# headless override - keeps CI behaving identically to a local run.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag expression to run'
        required: false
        default: '@web'

jobs:
  web-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Run the web test suite (Chrome, under a virtual display)
        uses: coactions/setup-xvfb@v1
        with:
          run: mvn test -DsuiteXmlFile=testng-web.xml -Dcucumber.filter.tags="${{ github.event.inputs.tags || '@web' }}"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-extent-report
          # Every run gets its own timestamped folder - see README.md
          # section 7B for why there's no fixed reports/... path.
          path: test-output/WebExtentReport*/reports/GajabAutomationReport.html

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-failure-screenshots
          path: screenshots/web/

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-automation-logs
          path: logs/web-automation.log
