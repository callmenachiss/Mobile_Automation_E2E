name: Mobile Regression Suite

# Starter CI pipeline for the Gajab Mobile Automation Framework.
# Adjust the emulator API level / target and the default tag expression
# below to match your app once real device/app details are filled in.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag expression to run'
        required: false
        default: '@smoke'

jobs:
  mobile-tests:
    # Android emulators need hardware acceleration; macOS runners provide it
    # out of the box for reactivecircus/android-emulator-runner.
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js (for Appium)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run the mobile test suite on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          script: mvn test -Dcucumber.filter.tags="${{ github.event.inputs.tags || '@smoke' }}"
        env:
          # Configure this as a repository secret (Settings -> Secrets and
          # variables -> Actions). Without it, the summary email is simply
          # skipped (logged), the build still passes/fails on test results.
          MAIL_FROM_PASSWORD: ${{ secrets.MAIL_FROM_PASSWORD }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-extent-report
          path: reports/GajabMobileAutomationReport.html

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-failure-screenshots
          path: screenshots/mobile/

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-automation-logs
          path: logs/mobile-automation.log
